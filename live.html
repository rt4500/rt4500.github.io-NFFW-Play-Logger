<body>

<div id="app">

<script>
const LIVE_CONFIG={
  url:'https://flagstats-live.trizzey11.workers.dev',
  token:'prag2026-x7k9m2'
};

function defaultSettings(){return{fieldLength:50,midfield:25,downsPerSeries:4,startYardLine:5};}
function deriveState(plays,s){
  let home=0,away=0,possession='home',spot=s.startYardLine,down=1;
  let seriesCrossedMid=false,awaitingPAT=false,patTeam=null;
  const add=(t,n)=>{t==='home'?home+=n:away+=n;};
  const newPoss=()=>{possession=possession==='home'?'away':'home';spot=s.startYardLine;down=1;seriesCrossedMid=false;};
  for(const p of plays){
    if(p.type==='pat'){ if(awaitingPAT&&patTeam&&p.pat&&p.pat.good) add(patTeam,p.pat.type==='2'?2:1);
      if(awaitingPAT){ awaitingPAT=false; newPoss(); } continue; }
    if(p.type==='safety'){ add(possession==='home'?'away':'home',2); newPoss(); continue; }
    if(p.type==='adjust'){
      if(p.setPossession) possession=p.setPossession;
      if(typeof p.setSpot==='number') spot=Math.max(0,Math.min(s.fieldLength,p.setSpot));
      if(typeof p.setDown==='number') down=Math.max(1,Math.min(s.downsPerSeries,p.setDown));
      seriesCrossedMid=(typeof p.setCrossedMid==='boolean')?p.setCrossedMid:(spot>=s.midfield);
      if(p.addHome) home+=p.addHome; if(p.addAway) away+=p.addAway;
      awaitingPAT=false; patTeam=null; continue;
    }
    if(p.type==='penalty'){ const y=p.penalty.yards||0;
      if(p.penalty.on==='def'){ const half=(s.fieldLength-spot)/2; spot=spot+Math.min(y,half); }
      else { const half=spot/2; spot=spot-Math.min(y,half); }
      spot=Math.max(0,Math.min(s.fieldLength,Math.round(spot)));
      // Crossing the midline via penalty earns the fresh set of downs — but only once
      // per series: being pushed back behind midline does NOT reset it.
      if(!seriesCrossedMid && spot>=s.midfield){ seriesCrossedMid=true; down=1; }
      if(p.penalty.autoFirst) down=1;
      if(p.penalty.lossOfDown){ down+=1; if(down>s.downsPerSeries) newPoss(); }
      continue; }
    const start=(typeof p.startSpot==='number')?p.startSpot:spot;
    let end=(typeof p.endSpot==='number')?p.endSpot:start;
    if(p.interception){ possession=possession==='home'?'away':'home';
      const ret=(p.intReturnEndSpot!=null)?p.intReturnEndSpot:(s.fieldLength-start);
      if(ret>=s.fieldLength){ // pick-6
        add(possession,6); awaitingPAT=true; patTeam=possession; continue;
      }
      spot=Math.max(0,Math.min(s.fieldLength,ret));
      down=1; seriesCrossedMid=spot>=s.midfield; continue; }
    if(p.touchdown||end>=s.fieldLength){ add(possession,6); awaitingPAT=true; patTeam=possession; continue; }
    spot=Math.max(0,Math.min(s.fieldLength,end));
    if(!seriesCrossedMid&&spot>=s.midfield){ seriesCrossedMid=true; down=1; }
    else{ down+=1; if(down>s.downsPerSeries) newPoss(); }
  }
  const target=seriesCrossedMid?s.fieldLength:s.midfield;
  return{home,away,possession,spot,down,seriesCrossedMid,target,distance:Math.max(0,target-spot),awaitingPAT,patTeam};
}


function blankLine(){return{att:0,comp:0,passYds:0,passTD:0,int:0,tgt:0,rec:0,recYds:0,recTD:0,drops:0,
  rushAtt:0,rushYds:0,rushTD:0,flags:0,tfl:0,sacks:0,pbu:0,defint:0,intRetYds:0,intRetTD:0,missedFlags:0,
  convThrow:0,convMade:0,convPts:0};}
function computeStats(game){
  const S=game.settings;
  const stats={home:{},away:{}};
  const ensure=(side,pid)=>{ if(!pid) return null; if(!stats[side][pid]) stats[side][pid]=blankLine(); return stats[side][pid]; };
  let possession='home';
  // replay possession to know offense/defense per play
  const st0=()=>{};
  let sim=[];
  for(const p of game.plays){
    const cur=deriveState(sim,S); possession=cur.possession;
    const off=possession, def=possession==='home'?'away':'home';
    const gain=(typeof p.endSpot==='number'&&typeof p.startSpot==='number')?(p.endSpot-p.startSpot):0;
    if(p.type==='pass'){
      const qb=ensure(off,p.passer);
      if(qb){ qb.att++; }
      const rec=ensure(off,p.receiver);
      if(p.receiver&&rec){ rec.tgt++; }
      if(p.interception){ if(qb) qb.int++; const d=ensure(def,p.interceptedBy);
        if(d){ d.defint++; d.intRetYds+=(p.intReturnYds||0);
          if(p.intReturnEndSpot!=null&&p.intReturnEndSpot>=S.fieldLength) d.intRetTD++; } }
      else if(p.complete){ if(qb){qb.comp++; qb.passYds+=gain;} if(rec){rec.rec++; rec.recYds+=gain;}
        if(p.touchdown){ if(qb)qb.passTD++; if(rec)rec.recTD++; } }
      else { // incomplete
        if(p.incompleteReason==='drop'&&rec) rec.drops++;
        if(p.incompleteReason==='defended'){ const d=ensure(def,p.defendedBy); if(d)d.pbu++; }
      }
    } else if(p.type==='run'){
      const r=ensure(off,p.rusher); if(r){ r.rushAtt++; r.rushYds+=gain; if(p.touchdown)r.rushTD++; }
    } else if(p.type==='sack'){
      const d=ensure(def,p.sackBy); if(d){ d.sacks++; d.flags++; d.tfl++; }
    } else if(p.type==='pat'){
      if(cur.awaitingPAT && p.pat && p.pat.good){
        const pts=p.pat.type==='2'?2:1;
        if(p.pat.via==='pass'){ const qb=ensure(off,p.passer); if(qb)qb.convThrow++;
          const rc=ensure(off,p.receiver); if(rc){ rc.convMade++; rc.convPts+=pts; } }
        else if(p.pat.via==='run'){ const r=ensure(off,p.rusher); if(r){ r.convMade++; r.convPts+=pts; } }
      }
    }
    // flag pull credited on a stop short of the end zone; a TD instead records a missed flag
    if((p.type==='run'||(p.type==='pass'&&p.complete))&&!p.touchdown&&p.flagPullBy){
      const d=ensure(def,p.flagPullBy); if(d){ d.flags++; if(gain<0)d.tfl++; }
    }
    if((p.type==='run'||(p.type==='pass'&&p.complete))&&p.touchdown&&p.missedFlagBy){
      const d=ensure(def,p.missedFlagBy); if(d){ d.missedFlags++; }
    }
    sim.push(p);
  }
  return stats;
}


const IOC_CODES={'Switzerland':'SUI','Ireland':'IRL','Sweden':'SWE','Ukraine':'UKR','Poland':'POL','Czechia':'CZE','Finland':'FIN'};
function teamCode(g,side){ const n=g.teams[side].name; return IOC_CODES[n]||n.slice(0,3).toUpperCase(); }
function posLabel(g,yard,off){ const L=g.settings.fieldLength, mid=g.settings.midfield;
  const def=off==='home'?'away':'home';
  if(yard<=0) return teamCode(g,off)+' goal'; if(yard>=L) return 'goal line';
  if(yard===mid) return 'midfield'; if(yard<mid) return teamCode(g,off)+' '+yard; return teamCode(g,def)+' '+(L-yard); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let live={}, expand={}, rosters={updated:0,teams:null}, rosterOpen={}, showAllSched=false;
const NC_SCHEDULE=[
 ['Fri 21.8','10:00','Field 1','Sweden','Ukraine'],['Fri 21.8','10:00','Field 2','Ireland','Czechia'],
 ['Fri 21.8','11:15','Field 1','Finland','Switzerland'],['Fri 21.8','11:15','Field 2','Ukraine','Poland'],
 ['Fri 21.8','12:30','Field 1','Sweden','Czechia'],['Fri 21.8','12:30','Field 2','Ireland','Switzerland'],
 ['Fri 21.8','13:45','Field 1','Finland','Poland'],['Fri 21.8','13:45','Field 2','Ireland','Ukraine'],
 ['Fri 21.8','15:00','Field 1','Switzerland','Poland'],['Fri 21.8','15:00','Field 2','Finland','Sweden'],
 ['Sat 22.8','09:00','Field 1','Czechia','Ukraine'],['Sat 22.8','09:00','Field 2','Poland','Sweden'],
 ['Sat 22.8','10:15','Field 1','Ukraine','Finland'],['Sat 22.8','10:15','Field 2','Czechia','Switzerland'],
 ['Sat 22.8','11:30','Field 1','Switzerland','Sweden'],['Sat 22.8','11:30','Field 2','Ireland','Poland'],
 ['Sat 22.8','13:45','Field 1','Czechia','Finland'],['Sat 22.8','13:45','Field 2','Ireland','Sweden'],
 ['Sat 22.8','15:00','Field 1','Ukraine','Switzerland'],['Sat 22.8','15:00','Field 2','Poland','Czechia'],
 ['Sat 22.8','16:15','Field 2','Ireland','Finland'],
];
function applyTheme(light){
  document.documentElement.setAttribute('data-theme', light?'light':'dark');
  const mc=document.querySelector('meta[name="theme-color"]'); if(mc) mc.setAttribute('content', light?'#EEF1F5':'#14171C');
  const b=document.getElementById('themeBtn'); if(b) b.textContent=light?'🌙 Dark':'☀ Light';
}
function toggleTheme(){
  const light=document.documentElement.getAttribute('data-theme')!=='light';
  try{ localStorage.setItem('fs_live_theme', light?'light':'dark'); }catch(e){}
  applyTheme(light);
}
try{ applyTheme(localStorage.getItem('fs_live_theme')==='light'); }catch(e){ applyTheme(false); }
function fmt(g){
  const st=scoreState(g);
  return {st};
}
/* Team totals: computed straight from the play list (numbers coerced — remote data). */
function teamTotals(g){
  const T=side=>({yds:0,comp:0,att:0,ptd:0,rtd:0,c1m:0,c1a:0,c2m:0,c2a:0,to:0,flags:0,sacks:0,defint:0});
  const t={home:T(),away:T()};
  (g.plays||[]).forEach(p=>{
    const off=p.offense==='away'?'away':'home', def=off==='home'?'away':'home';
    const gain=(Number(p.endSpot)||0)-(Number(p.startSpot)||0);
    if(p.type==='pass'&&!p.pat){
      t[off].att++;
      if(p.complete){ t[off].comp++; t[off].yds+=gain; }
      if(p.interception){ t[off].to++; t[def].defint++; }
    }
    if(p.type==='run') t[off].yds+=gain;
    if(p.type==='sack'){ t[off].yds+=gain; t[def].sacks++; }
    if(p.touchdown){ if(p.type==='run') t[off].rtd++; else if(p.type==='pass'&&!p.interception) t[off].ptd++; }
    if(p.type==='pat'&&p.pat){
      if(String(p.pat.type)==='2'){ t[off].c2a++; if(p.pat.good) t[off].c2m++; }
      else { t[off].c1a++; if(p.pat.good) t[off].c1m++; }
    }
    if(p.flagPullBy) t[def].flags++;
  });
  return t;
}
function teamTotalsTable(g){
  const t=teamTotals(g);
  const code=n=>esc(String(n).slice(0,3).toUpperCase());
  const H=t.home,A=t.away;
  const row=(label,hv,av)=>'<tr><td>'+label+'</td><td class="num">'+hv+'</td><td class="num">'+av+'</td></tr>';
  return '<div class="teamHead">Team totals</div>'+
    '<table><thead><tr><th></th><th>'+code(g.teams.home.name)+'</th><th>'+code(g.teams.away.name)+'</th></tr></thead><tbody>'+
    row('Yards',H.yds,A.yds)+
    row('Completions',H.comp+'/'+H.att,A.comp+'/'+A.att)+
    row('Pass/Rec TD',H.ptd,A.ptd)+
    row('Rush TD',H.rtd,A.rtd)+
    row('1-pt conv',H.c1m+'/'+H.c1a,A.c1m+'/'+A.c1a)+
    row('2-pt conv',H.c2m+'/'+H.c2a,A.c2m+'/'+A.c2a)+
    row('Turnovers',H.to,A.to)+
    row('Flag pulls',H.flags,A.flags)+
    row('Sacks',H.sacks,A.sacks)+
    row('INT (def)',H.defint,A.defint)+
    '</tbody></table>';
}
function boxTables(g){
  const stats=computeStats(g);
  let out=teamTotalsTable(g);
  ['home','away'].forEach(side=>{
    const rows=(g.teams[side].players||[]).map(p=>({p,s:stats[side][p.id]})).filter(x=>x.s);
    if(!rows.length) return;
    out+='<div class="teamHead">'+esc(g.teams[side].name)+'</div>';
    const off=rows.filter(x=>x.s.att||x.s.rec||x.s.rushAtt);
    if(off.length){
      out+='<table><thead><tr><th>Player</th><th>C/A</th><th>Pyd</th><th>Rec</th><th>Ryd</th><th>Rush</th><th>TD</th></tr></thead><tbody>';
      off.forEach(({p,s})=>{ out+='<tr><td>#'+esc(p.num)+' '+esc(p.name||'')+'</td><td class="num">'+s.comp+'/'+s.att+
        '</td><td class="num">'+s.passYds+'</td><td class="num">'+s.rec+'</td><td class="num">'+s.recYds+
        '</td><td class="num">'+s.rushYds+'</td><td class="num">'+(s.recTD+s.rushTD+s.intRetTD)+'</td></tr>'; });
      out+='</tbody></table>';
    }
    const def=rows.filter(x=>x.s.flags||x.s.sacks||x.s.pbu||x.s.defint);
    if(def.length){
      out+='<table><thead><tr><th>Defense</th><th>Flags</th><th>Sack</th><th>PBU</th><th>INT</th></tr></thead><tbody>';
      def.forEach(({p,s})=>{ out+='<tr><td>#'+esc(p.num)+' '+esc(p.name||'')+'</td><td class="num">'+s.flags+
        '</td><td class="num">'+s.sacks+'</td><td class="num">'+s.pbu+'</td><td class="num">'+s.defint+
        (s.intRetTD?(' ('+s.intRetTD+'TD)'):'')+'</td></tr>'; });
      out+='</tbody></table>';
    }
  });
  return out;
}
function render(){
  const root=document.getElementById('games');
  const entries=Object.entries(live).filter(([k,r])=>r.game&&r.game.plays&&r.game.plays.length>0)
    .sort((a,b)=>b[1].updated-a[1].updated);
  const liveE=entries.filter(([d,r])=>!r.game.finished);
  const doneE=entries.filter(([d,r])=>r.game.finished);
  root.innerHTML='';
  if(!entries.length) root.innerHTML='<div class="empty">Waiting for live games…</div>';
  liveE.forEach(([dev,rec])=>{
    const g=rec.game, st=scoreState(g);
    const ago=Math.max(0,Math.round((Date.now()-rec.updated)/1000));
    const situ=st.awaitingPAT?'Point after':(g.teams[st.possession].name+' ball · '+
      st.down+['st','nd','rd','th'][Math.min(st.down,4)-1]+' · '+posLabel(g,st.spot,st.possession));
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="score">'+
      '<div><div class="tn">'+esc(g.teams.home.name)+'</div><div class="sc">'+st.home+'</div></div>'+
      '<div style="color:var(--muted);font-size:11px"><span class="liveDot"></span>LIVE</div>'+
      '<div><div class="tn">'+esc(g.teams.away.name)+'</div><div class="sc">'+st.away+'</div></div></div>'+
      '<div class="meta">'+esc(g.name||'')+' · '+esc(situ)+' · updated '+(ago<60?ago+'s':Math.round(ago/60)+'min')+' ago</div>'+
      '<div class="toggle">'+(expand[dev]?'hide stats ▴':'show stats ▾')+'</div>'+
      (expand[dev]?boxTables(g):'');
    card.querySelector('.toggle').onclick=()=>{ expand[dev]=!expand[dev]; render(); };
    root.appendChild(card);
  });
  if(doneE.length){
    const dayOf=g=>{const n=g.name||''; return n.indexOf('Fri')===0?'Friday':(n.indexOf('Sat')===0?'Saturday':'Sunday · Bracket');};
    const groups={}; const order=['Friday','Saturday','Sunday · Bracket'];
    doneE.forEach(e=>{ const d=dayOf(e[1].game); (groups[d]=groups[d]||[]).push(e); });
    const card=document.createElement('div'); card.className='card';
    let html='<div class="teamHead" style="margin-top:0">Results ('+doneE.length+')</div>';
    order.forEach(day=>{
      if(!groups[day]) return;
      html+='<div class="schedDay">'+day+'</div>';
      groups[day].sort((a,b)=>String(a[1].game.name||'').localeCompare(String(b[1].game.name||'')));
      groups[day].forEach(([dev,rec])=>{
        const g=rec.game, st=scoreState(g);
        const t=(g.name||'').replace(/^(Fri 21\.8|Sat 22\.8|Sun 23\.8)\s*/,'').replace('Field ','F');
        const hw=st.home>st.away, aw=st.away>st.home;
        html+='<div class="resRow" data-dev="'+esc(dev)+'">'+
          '<span class="resMeta">'+esc(t)+'</span>'+
          '<span class="resTeams"><span'+(hw?' class="win"':'')+'>'+esc(g.teams.home.name)+'</span>'+
          ' <span class="resScore">'+st.home+'–'+st.away+'</span> '+
          '<span'+(aw?' class="win"':'')+'>'+esc(g.teams.away.name)+'</span></span>'+
          '<span class="resX">'+(expand[dev]?'▴':'▾')+'</span></div>'+
          (expand[dev]?boxTables(g):'');
      });
    });
    card.innerHTML=html;
    card.querySelectorAll('.resRow').forEach(el=>{
      el.onclick=()=>{ const d=el.getAttribute('data-dev'); expand[d]=!expand[d]; render(); };
    });
    root.appendChild(card);
  }
  renderTables();
  renderSchedule();
  renderSquads();
}

/* ---- Standings · Leaders · Bracket (from all received games) ---- */
function allGames(){ return Object.values(live).map(r=>r.game).filter(g=>g&&g.plays&&g.plays.length); }
function scoreState(g){ const st=deriveState(g.plays,g.settings);
  return g.__ov ? {...st,home:g.__ov.home,away:g.__ov.away} : st; }
function dedupedGames(){
  const byKey={}, order=[];
  allGames().forEach(g=>{
    const key=(g.name||'')+'|'+g.teams.home.name+'|'+g.teams.away.name;
    if(!byKey[key]){ byKey[key]=g; order.push(key); return; }
    const cur=byKey[key];
    if(!!g.finished!==!!cur.finished){ byKey[key]=g.finished?g:cur; return; }
    if((g.plays||[]).length>(cur.plays||[]).length) byKey[key]=g;
  });
  return order.map(k=>byKey[k]);
}
function standingsRows(){
  const tbl={}; const row=n=>tbl[n]||(tbl[n]={team:n,pld:0,w:0,d:0,l:0,gf:0,ga:0});
  // seed every team seen in ANY broadcast game (even one still in progress) so the
  // table shows the whole field, not just teams with a finished result yet
  dedupedGames().forEach(g=>{ row(g.teams.home.name); row(g.teams.away.name); });
  dedupedGames().filter(g=>g.finished).forEach(g=>{
    const st=scoreState(g);
    const H=row(g.teams.home.name), A=row(g.teams.away.name);
    H.pld++; A.pld++; H.gf+=st.home; H.ga+=st.away; A.gf+=st.away; A.ga+=st.home;
    if(st.home>st.away){H.w++;A.l++;} else if(st.home<st.away){A.w++;H.l++;} else {H.d++;A.d++;}
  });
  const rows=Object.values(tbl).map(r=>({...r,gd:r.gf-r.ga,pct:r.pld?((r.w+0.5*r.d)/r.pld):0}));
  rows.sort((a,b)=>b.pct-a.pct||b.gd-a.gd||b.gf-a.gf||a.team.localeCompare(b.team));
  return rows;
}
function leaderRows(){
  const agg={};
  dedupedGames().forEach(g=>{
    const stats=computeStats(g);
    ['home','away'].forEach(side=>{
      const roster=g.teams[side].players||[];
      Object.entries(stats[side]).forEach(([pid,s])=>{
        const p=roster.find(x=>x.id===pid)||{num:'?',name:''};
        const key=g.teams[side].name+'|'+p.num+'|'+(p.num==='?'?pid:'');
        if(!agg[key]) agg[key]={team:g.teams[side].name,num:p.num,name:p.name||'',line:blankLine()};
        for(const k in s) agg[key].line[k]=(agg[key].line[k]||0)+s[k];
      });
    });
  });
  return Object.values(agg);
}
function renderSchedule(){
  const root=document.getElementById('schedule'); if(!root) return;
  // match a broadcast game to a schedule row by its label, falling back to the team pair
  const received=Object.values(live).map(r=>r.game).filter(Boolean);
  const findGame=(label,home,away)=>{
    let g=received.find(x=>(x.name||'')===label);
    if(!g) g=received.find(x=>x.teams&&x.teams.home.name===home&&x.teams.away.name===away&&(x.name||'').indexOf(label.split(' ·')[0])===0);
    return g;
  };
  const rows=NC_SCHEDULE.map(([day,time,field,home,away])=>{
    const label=day+' '+time+' · '+field;
    const g=findGame(label,home,away);
    let status='upcoming', score='';
    if(g){ const st=scoreState(g);
      score=st.home+'–'+st.away;
      status=g.finished?'final':'live'; }
    return {day,time,field,home,away,status,score};
  });
  const done=rows.filter(r=>r.status!=='upcoming').length;
  // default view: anything not yet final, plus the last few results
  const visible=showAllSched?rows:rows.filter(r=>r.status!=='final').slice(0,8);
  let html='<div class="card"><div class="teamHead" style="margin-top:0">Schedule ('+done+' of 21 played)</div>';
  let lastDay='';
  visible.forEach(r=>{
    if(r.day!==lastDay){ html+='<div class="schedDay">'+esc(r.day==='Fri 21.8'?'Friday 21 August':'Saturday 22 August')+'</div>'; lastDay=r.day; }
    const badge = r.status==='live' ? '<span class="schedLive"><span class="liveDot"></span>LIVE</span>'
      : r.status==='final' ? '<span class="schedScore">'+esc(r.score)+'</span>'
      : '<span class="schedTime">'+esc(r.time)+'</span>';
    const scoreLive = r.status==='live' ? ' <span class="schedScore">'+esc(r.score)+'</span>' : '';
    html+='<div class="schedRow"><div class="schedMeta">'+esc(r.time)+' · '+esc(r.field.replace('Field ','F'))+'</div>'+
      '<div class="schedTeams">'+esc(r.home)+' <span style="color:var(--muted)">v</span> '+esc(r.away)+scoreLive+'</div>'+
      '<div class="schedStat">'+badge+'</div></div>';
  });
  if(rows.length>visible.length || showAllSched){
    html+='<div class="toggle" id="schedToggle">'+(showAllSched?'show upcoming only ▴':'show full schedule &amp; results ▾')+'</div>';
  }
  html+='</div>';
  root.innerHTML=html;
  const tg=document.getElementById('schedToggle');
  if(tg) tg.onclick=()=>{ showAllSched=!showAllSched; renderSchedule(); };
}
function renderSquads(){
  const root=document.getElementById('squads'); if(!root) return;
  const t=rosters.teams;
  if(!t){ root.innerHTML=''; return; }
  const names=Object.keys(t).filter(k=>{
    if(k==='__proto__'||k==='constructor'||k==='prototype') return false;
    const tm=t[k];
    return tm && !tm.test && Array.isArray(tm.players) && tm.players.length; // real squads only
  }).sort();
  if(!names.length){ root.innerHTML=''; return; }
  let html='<div class="card"><div class="teamHead" style="margin-top:0">Squads ('+names.length+')</div>';
  names.forEach(n=>{
    const players=t[n].players.slice().sort((a,b)=>(parseInt(a.num,10)||999)-(parseInt(b.num,10)||999));
    html+='<div class="squadRow" data-team="'+esc(n)+'">'+esc(n)+
      ' <span style="color:var(--muted);font-weight:400">'+players.length+' players</span>'+
      '<span style="float:right;color:var(--amber)">'+(rosterOpen[n]?'▴':'▾')+'</span></div>';
    if(rosterOpen[n]){
      html+='<table><tbody>';
      players.forEach(p=>{ html+='<tr><td style="width:38px" class="num">#'+esc(p.num)+'</td><td>'+esc(p.name||'')+'</td></tr>'; });
      html+='</tbody></table>';
    }
  });
  html+='</div>';
  root.innerHTML=html;
  root.querySelectorAll('.squadRow').forEach(el=>{
    el.onclick=()=>{ const n=el.getAttribute('data-team'); rosterOpen[n]=!rosterOpen[n]; renderSquads(); };
  });
}
function renderTables(){
  const root=document.getElementById('tables'); if(!root) return;
  let html='';
  const st=standingsRows();
  const finals=dedupedGames().filter(g=>g.finished).length;
  if(st.length){
    html+='<div class="card"><div class="teamHead" style="margin-top:0">Standings ('+finals+' of 21 group games final)</div>';
    html+='<table><thead><tr><th>Team</th><th>PLD</th><th>W</th><th>L</th><th>PCT</th><th>GD</th></tr></thead><tbody>';
    st.forEach((r,i)=>{ html+='<tr><td>'+(i+1)+' '+esc(r.team)+'</td><td class="num">'+r.pld+'</td><td class="num">'+r.w+
      '</td><td class="num">'+r.l+'</td><td class="num"><b>'+r.pct.toFixed(3).replace(/^0/,'')+'</b></td><td class="num">'+r.gd+'</td></tr>'; });
    html+='</tbody></table></div>';
  }
  const all=leaderRows();
  if(all.length){
    html+='<div class="card"><div class="teamHead" style="margin-top:0">Tournament leaders</div>';
    const lead=(title,fn,fmt)=>{
      const s2=all.filter(a=>fn(a.line)>0).sort((a,b)=>fn(b.line)-fn(a.line)).slice(0,5);
      if(!s2.length) return;
      html+='<div class="teamHead">'+title+'</div><table><tbody>';
      s2.forEach(a=>{ html+='<tr><td>#'+esc(a.num)+' '+esc(a.name)+' <span style="color:var(--muted);font-size:10px">'+esc(a.team)+'</span></td><td class="num">'+fmt(a.line)+'</td></tr>'; });
      html+='</tbody></table>';
    };
    lead('Passing yards',l=>l.passYds,l=>l.passYds);
    lead('Receiving yards',l=>l.recYds,l=>l.recYds+' ('+l.rec+')');
    lead('Rushing yards',l=>l.rushYds,l=>l.rushYds);
    lead('TD scored',l=>l.recTD+l.rushTD+l.intRetTD,l=>l.recTD+l.rushTD+l.intRetTD);
    lead('Flag pulls',l=>l.flags,l=>l.flags);
    lead('Interceptions',l=>l.defint,l=>l.defint+(l.intRetTD?' ('+l.intRetTD+' TD)':''));
    html+='</div>';
  }
  const brk=dedupedGames().filter(g=>{const n=g.name||''; return n.indexOf('Fri')!==0 && n.indexOf('Sat')!==0;});
  const pair=g=>[g.teams.home.name,g.teams.away.name].sort().join('|');
  const ROUNDS=[['Final','Czechia|Ukraine'],['3rd place','Finland|Switzerland'],
    ['Semi Final 1','Switzerland|Ukraine'],['Semi Final 2','Czechia|Finland'],
    ['Quarter Final 2','Ireland|Switzerland'],['Quarter Final 3','Finland|Sweden'],
    ['Quarter Final 4','Czechia|Poland'],
    ['Place 5–7','Ireland|Sweden'],['Place 5–7','Poland|Sweden'],['Place 5–7','Ireland|Poland']];
  if(brk.length>=1){
    const find=(pk)=>brk.find(g=>pair(g)===pk);
    html+='<div class="card"><div class="teamHead" style="margin-top:0">Bracket</div><table><tbody>';
    let champ=null;
    ROUNDS.forEach(([round,pk])=>{
      const g=find(pk);
      let cell='<span style="color:var(--muted)">'+esc(pk.split('|').join(' v '))+'</span>';
      if(g&&g.finished){ const sc=scoreState(g);
        const w=sc.home>sc.away?g.teams.home.name:(sc.away>sc.home?g.teams.away.name:null);
        cell='<b>'+esc(g.teams.home.name)+'</b> '+sc.home+'–'+sc.away+' <b>'+esc(g.teams.away.name)+'</b>';
        if(w) cell=cell.replace('<b>'+esc(w)+'</b>','<b style="color:var(--amber)">'+esc(w)+'</b>');
        if(round==='Final'&&w) champ=w;
      }
      html+='<tr><td style="white-space:nowrap">'+round+'</td><td class="num" style="text-align:left">'+cell+'</td></tr>';
    });
    html+='</tbody></table>';
    if(champ) html+='<div style="text-align:center;margin-top:10px;font-weight:800;font-size:15px">🏆 '+esc(champ)+' — Nations Cup Champions 2026</div>';
    html+='</div>';
  }
  if(brk.length<1 && st.length>=2){
    const seed=(n)=>st[n-1]?esc(st[n-1].team):'—';
    const prov=finals<21?' <span style="color:var(--amber)">(provisional)</span>':'';
    html+='<div class="card"><div class="teamHead" style="margin-top:0">Sunday bracket preview'+prov+'</div>';
    html+='<table><tbody>'+
      '<tr><td>QF2 · 09:00</td><td class="num">'+seed(4)+' vs '+seed(5)+'</td></tr>'+
      '<tr><td>QF3 · 09:00</td><td class="num">'+seed(2)+' vs '+seed(7)+'</td></tr>'+
      '<tr><td>QF4 · 10:15</td><td class="num">'+seed(3)+' vs '+seed(6)+'</td></tr>'+
      '<tr><td>SF1 · 11:30</td><td class="num">'+seed(1)+' vs winner QF2</td></tr>'+
      '<tr><td>SF2 · 11:30</td><td class="num">winner QF3 vs winner QF4</td></tr>'+
      '<tr><td>3rd place · 14:00</td><td class="num">losers of the semis</td></tr>'+
      '<tr><td>Final · 15:15</td><td class="num">winners of the semis</td></tr>'+
      '</tbody></table>'+
      '<div class="meta" style="text-align:left;margin-top:6px">Seeding from current standings · 1st seed has a bye into Semi Final 1.</div></div>';
  }
  root.innerHTML=html;
}
async function poll(){
  const el=document.getElementById('status');
  try{
    let r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g',{cache:'no-store'});
    if(r.status===403&&LIVE_CONFIG.token){ r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g?t='+encodeURIComponent(LIVE_CONFIG.token),{cache:'no-store'}); }
    if(!r.ok){ el.innerHTML='<span class="err">connection problem ('+r.status+')</span>'; return; }
    const arr=await r.json();
    if(Array.isArray(arr)){ arr.forEach(rec=>{ if(!rec) return;
        // published squad lists (only real, hand-entered rosters are ever published)
        if(rec.type==='flagstats-teams' && rec.teams){
          if(!rosters.updated || (rec.updated||0)>=rosters.updated){ rosters={updated:rec.updated||0,teams:rec.teams}; }
          return; }
        if(!rec.game) return;
        const k=String(rec.game.id||rec.device||''); if(!k||k==='__proto__'||k==='constructor'||k==='prototype') return;
        if(rec.override&&rec.game){ rec.game.__ov={home:+rec.override.home||0,away:+rec.override.away||0};
          rec.game.finished=!!rec.override.finished; }
        live[k]=rec; });
      el.textContent='last update '+new Date().toLocaleTimeString(); render(); }
  }catch(e){ el.innerHTML='<span class="err">offline — retrying…</span>'; }
}
let pollTimer=null;
function startPolling(){ if(pollTimer) return; poll(); pollTimer=setInterval(poll,30000); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
document.addEventListener('visibilitychange',()=>{ document.visibilityState==='hidden'?stopPolling():startPolling(); });
startPolling();
</script>
