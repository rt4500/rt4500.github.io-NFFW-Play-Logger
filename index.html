function downloadTourneyCSV(all){
  const cols=['team','num','name','att','comp','passYds','passTD','int','tgt','rec','recYds','recTD','drops','rushAtt','rushYds','rushTD','flags','tfl','sacks','pbu','defint','intRetYds','intRetTD','convThrow','convMade','convPts'];
  let csv=cols.join(',')+'\n';
  all.forEach(a=>{ const row=cols.map(c=>{ if(c in a) return csvCell(a[c]); return a.line[c]??0; }); csv+=row.join(',')+'\n'; });
  downloadBlob(csv,'nations-cup-stats.csv','text/csv');
}
function csvCell(v){ v=String(v);
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v; // neutralize spreadsheet formula injection
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

/* ============================================================
   EXPORT / DOWNLOAD
   ============================================================ */
function gameFileName(g,ext){
  const st=g.plays.length?deriveState(g.plays,g.settings):null;
  const parts=[g.teams.home.name+'-vs-'+g.teams.away.name];
  if(g.name) parts.push(g.name);
  if(st) parts.push(st.home+'-'+st.away);
  return parts.join('_').replace(/[^\w.\-]+/g,'_').replace(/_+/g,'_')+ext;
}
function exportGame(g){
  downloadBlob(JSON.stringify(g,null,2), gameFileName(g,'.json'),'application/json');
  g.exportedPlays=g.plays.length; // remember what was backed up (for delete safeguards)
  if(games.includes(g)) persist();
}
/* One-tap share (Web Share API) — sends the JSON straight to WhatsApp/Signal/Mail.
   Falls back to a normal download where sharing files isn't supported. */
async function shareGame(g){
  const json=JSON.stringify(g,null,2);
  try{
    const file=new File([json],gameFileName(g,'.json'),{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:gameFileName(g,'')});
      g.exportedPlays=g.plays.length; if(games.includes(g)) persist(); render();
      toast('Shared'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; /* user cancelled: not exported */ }
  exportGame(g); // fallback
}
/* ---- LIVE SYNC (optional) ----
   Local-first broadcasting: this device stays the source of truth and pushes a
   copy of the ACTIVE game to its own JSONBin bin after each change (debounced).
   One device = one bin = one writer, so there are no sync conflicts.
   Offline? Nothing breaks — it retries when the connection returns. */
let syncTimer=null, lastPush=0;
function autoMode(){ return !!LIVE_CONFIG.url && prefs.syncOn!==false; } // built-in config: on by default, opt-out via toggle
function manualMode(){ return !LIVE_CONFIG.url && prefs.syncOn && (prefs.syncKey||'').trim() && (prefs.syncBin||'').trim(); }
function syncConfigured(){ return (autoMode()&&!!writeCred())||manualMode(); }
function schedulePush(){
  if(!syncConfigured()) return;
  clearTimeout(syncTimer);
  const throttle=autoMode()?25000:20000; // gentle on the free-tier daily write quota
  const wait = (Date.now()-lastPush>throttle) ? 400 : (autoMode()?25000:8000);
  updateSyncChip('pending');
  syncTimer=setTimeout(pushActive, wait);
}
async function pushActive(gameArg){
  const g=gameArg||activeGame(); if(!g||!syncConfigured()) return;
  if(g.practice) return; // practice games never broadcast
  if(!g.plays.length){ return; } // nothing to broadcast — keeps viewer devices silent
  lastPush=Date.now();
  try{
    const payload={type:'flagstats-live',updated:Date.now(),device:deviceId,game:g};
    let r;
    if(autoMode()){
      const q=writeKey?('?k='+encodeURIComponent(writeKey)):(LIVE_CONFIG.token?('?t='+encodeURIComponent(LIVE_CONFIG.token)):'');
      // one slot PER GAME (not per device): finished games stay on the relay
      r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g/'+deviceId+'-'+g.id+q,{
        method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    } else {
      r=await fetch('https://api.jsonbin.io/v3/b/'+prefs.syncBin.trim(),{
        method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':prefs.syncKey.trim()},
        body:JSON.stringify(payload)});
    }
    if(!r.ok) throw new Error('http '+r.status);
    g._syncedPlays=g.plays.length;
    updateSyncChip('ok');
  }catch(e){ updateSyncChip('err'); }
}
function updateSyncChip(state){
  const el=document.getElementById('syncChip'); if(!el) return;
  const map={ok:['● LIVE','var(--green)'],pending:['● syncing…','var(--amber)'],err:['● offline','var(--red)']};
  const m=map[state]; if(m){ el.textContent=m[0]; el.style.color=m[1]; }
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',()=>{ if(syncConfigured()) schedulePush(); });
}

/* ---- LIVE VIEWER: poll other tablets' bins (read-only role) ---- */
let liveGames={}, liveTimer=null, liveFetching=false, liveExpand={}, liveStatus='';
function viewBinIds(){ return (prefs.viewBins||'').split(',').map(s=>s.trim()).filter(Boolean); }
function viewerConfigured(){ return (!!LIVE_CONFIG.url && prefs.syncOn!==false) || (viewBinIds().length && (prefs.syncKey||'').trim()); }
async function fetchLive(force){
  if(liveFetching && !force) return;
  liveFetching=true;
  try{
    if(autoMode()){
      let r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g',{cache:'no-store'});
      if(r.status===403&&LIVE_CONFIG.token){ // legacy worker still token-gating reads
        r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g?t='+encodeURIComponent(LIVE_CONFIG.token),{cache:'no-store'}); }
      if(!r.ok){ liveStatus='error: server said '+r.status+(r.status===403?' (token mismatch)':''); }
      else {
        let arr=null;
        try{ arr=await r.json(); }catch(e){ liveStatus='error: unexpected response (not JSON)'; }
        if(Array.isArray(arr)){
          arr.forEach(rec=>{ if(!rec||!rec.game) return;
            const k=String(rec.game.id||rec.device||''); if(!k||unsafeKey(k)) return;
            if(rec.override&&rec.game){ rec.game.__ov={home:+rec.override.home||0,away:+rec.override.away||0};
              rec.game.finished=!!rec.override.finished; }
            liveGames[k]=rec; });
          liveStatus='last check '+new Date().toLocaleTimeString()+' · '+arr.length+' broadcast(s) on server';
        } else if(arr!==null){ liveStatus='error: unexpected response shape'; }
      }
    } else {
      for(const id of viewBinIds()){
        try{
          const r=await fetch('https://api.jsonbin.io/v3/b/'+id+'/latest',{headers:{'X-Master-Key':(prefs.syncKey||'').trim()},cache:'no-store'});
          if(!r.ok) continue;
          const j=await r.json();
          if(j&&j.record&&j.record.game) liveGames[id]=j.record;
        }catch(e){}
      }
      liveStatus='last check '+new Date().toLocaleTimeString();
    }
  }catch(e){ liveStatus='error: '+(e&&e.message?e.message:'network failure'); }
  liveFetching=false;
  if(typeof curTab!=='undefined' && curTab==='tourney') render();
}
function startLivePolling(){ stopLivePolling();
  if(viewerConfigured() && (typeof document==='undefined'||document.visibilityState!=='hidden')){
    fetchLive(); liveTimer=setInterval(fetchLive,20000); } }
function stopLivePolling(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }
if(typeof document!=='undefined'&&document.addEventListener){
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden') stopLivePolling();
    else if(typeof curTab!=='undefined'&&curTab==='tourney') startLivePolling();
  });
}

/* ---- DEVICE CHECK: one-tap tournament readiness ---- */
async function deviceCheck(){
  const rows=[]; const R=(state,label,detail)=>rows.push({state,label,detail:detail||''});
  // relay reachable + key valid
  if(LIVE_CONFIG.url){
    try{
      const r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g',{cache:'no-store'});
      R(r.ok?'ok':'fail','Live relay reachable',r.ok?'':'HTTP '+r.status);
    }catch(e){ R('fail','Live relay reachable','no connection'); }
    if(writeKey){
      try{
        const r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/ping?k='+encodeURIComponent(writeKey),{cache:'no-store'});
        const j=await r.json();
        R(j&&j.ok?'ok':'fail','Keeper key', j&&j.ok?('valid · role: '+j.role):'REJECTED — open the current keeper link again');
      }catch(e){ R('warn','Keeper key','could not verify (offline?)'); }
    } else R('fail','Keeper key','none — this device cannot broadcast. Open its keeper link once.');
  } else R('warn','Live sync','not configured');
  // offline capability
  try{
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    const keys=(typeof caches!=='undefined')?await caches.keys():[];
    const cached=keys.some(k=>k.startsWith('flag-stats'));
    R(reg&&cached?'ok':(reg?'warn':'fail'),'Offline ready',reg?(cached?'app cached for offline use':'installed, cache still filling — reload once online'):'service worker missing — reload once online');
  }catch(e){ R('warn','Offline ready','could not verify'); }
  // schedule
  const sched=games.filter(g=>/Fri 21\.8|Sat 22\.8/.test(g.name||'')).length;
  R(sched>=21?'ok':(sched>0?'warn':'fail'),'Group schedule',sched+' of 21 fixtures on this device');
  // rosters
  const nations=['Switzerland','Ireland','Sweden','Ukraine','Poland','Czechia','Finland'];
  const missing=nations.filter(n=>!teams[n]||!(teams[n].players||[]).length);
  const counts=nations.filter(n=>teams[n]).map(n=>teamCodeName(n)+' '+(teams[n].players||[]).length).join(' · ');
  R(missing.length?'fail':'ok','Team rosters',missing.length?('missing: '+missing.join(', ')):counts);
  // field filter + clock (info)
  R('ok','Field filter',(prefs.fieldFilter&&prefs.fieldFilter!=='all')?prefs.fieldFilter:'all games (hub)');
  const icon=st=>st==='ok'?'<span style="color:var(--green)">✓</span>':st==='warn'?'<span style="color:var(--amber)">!</span>':'<span style="color:var(--red)">✗</span>';
  const html=rows.map(r=>`<div style="display:flex;gap:8px;margin:5px 0"><div style="width:14px">${icon(r.state)}</div><div><b>${esc(r.label)}</b>${r.detail?` — <span class="help" style="display:inline">${esc(r.detail)}</span>`:''}</div></div>`).join('');
  showModal({title:'Device check',body:html,buttons:[{label:'Close'}]});
}
function teamCodeName(n){ return (typeof IOC_CODES!=='undefined'&&IOC_CODES[n])||n.slice(0,3).toUpperCase(); }

/* ---- ROSTERS VIA RELAY: publish once, every device pulls ---- */
/* Which squads are REAL (publishable)?
   A stored flag alone isn't enough — test rosters created by older versions have no
   flag — so we also detect generated placeholder data by its contents. `real:true`
   (set by pasting/saving, or by the manual toggle) always wins. */
function looksGenerated(name,t){
  const pool=TEST_POOLS[name]; const ps=t.players||[];
  if(!pool||!ps.length) return false;
  const fake=new Set(); pool.f.forEach((f,i)=>fake.add((f+' '+pool.l[i]).toLowerCase()));
  const hits=ps.filter(p=>fake.has(String(p.name||'').toLowerCase())).length;
  return hits>=Math.max(2,Math.ceil(ps.length*0.5)); // half or more are placeholder names
}
function isRealTeam(name,t){
  if(!t||!(t.players||[]).length) return false;
  if(t.real===true) return true;      // explicitly confirmed (pasted / saved / toggled on)
  if(t.test===true) return false;     // explicitly generated
  return !looksGenerated(name,t);     // legacy data: judge by contents
}
function realTeams(){
  const out={};
  for(const k in teams){ if(isRealTeam(k,teams[k])) out[k]=teams[k]; }
  return out;
}
async function publishRosters(){
  if(!LIVE_CONFIG.url||!writeCred()){ toast('Needs a keeper link'); return; }
  try{
    const q=writeKey?('?k='+encodeURIComponent(writeKey)):('?t='+encodeURIComponent(LIVE_CONFIG.token));
    const r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g/rosters'+q,{method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'flagstats-teams',updated:Date.now(),teams:realTeams()})});
    const n=Object.keys(realTeams()).length;
    toast(r.ok?(n+' real squad(s) published — test rosters excluded'):'Publish failed ('+r.status+')');
  }catch(e){ toast('Publish failed — offline?'); }
}
async function fetchRostersLive(){
  if(!LIVE_CONFIG.url){ toast('Live sync not configured'); return; }
  try{
    const r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g',{cache:'no-store'});
    const arr=await r.json();
    const recs=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.type==='flagstats-teams'&&x.teams).sort((a,b)=>(b.updated||0)-(a.updated||0));
    if(!recs.length){ toast('No rosters published yet'); return; }
    let n=0; for(const k in recs[0].teams){ if(unsafeKey(k)) continue; teams[k]=recs[0].teams[k]; n++; }
    persist(); render(); toast(n+' team(s) fetched from live server');
  }catch(e){ toast('Fetch failed — offline?'); }
}

/* ---- SUNDAY BRACKET: create the QFs from the standings ---- */
function createBracketQFs(standings){
  const clone=(n)=>({name:n,players:((teams[n]&&teams[n].players)||[]).map(p=>({...p}))});
  const seed=(i)=>standings[i-1]&&standings[i-1].team;
  const fixtures=[
    ['Sun 23.8 09:00 · Field 1 · QF2',seed(4),seed(5)],
    ['Sun 23.8 09:00 · Field 2 · QF3',seed(2),seed(7)],
    ['Sun 23.8 10:15 · Field 1 · QF4',seed(3),seed(6)],
  ];
  let added=0;
  fixtures.forEach(([label,hn,an])=>{
    if(!hn||!an) return;
    if(games.some(g=>g.name===label)) return;
    games.push({id:uid(),name:label,date:Date.now(),settings:defaultSettings(),
      teams:{home:clone(hn),away:clone(an)},plays:[]});
    added++;
  });
  persist(); return added;
}

/* ---- PRACTICE MODE: rehearse without broadcasting or polluting anything ---- */
function createPracticeGame(){
  const demo=(nm,pre)=>({name:nm,players:Array.from({length:8},(_,i)=>({id:uid(),num:String(i+1),name:pre+' '+(i+1)}))});
  const g={id:uid(),name:'PRACTICE — safe to experiment',date:Date.now(),practice:true,
    settings:defaultSettings(),teams:{home:demo('Demo Blue','Blue'),away:demo('Demo Red','Red')},plays:[]};
  games.unshift(g); activeId=g.id; persist();
  if(typeof switchTab==='function') switchTab('live');
  toast('Practice game — never broadcast, delete any time');
}

/* Whole-day bundle: every played game in one file (one file per tablet per day) */
function exportBundle(){
  const played=games.filter(g=>g.plays.length>0&&!g.practice);
  if(!played.length){ toast('No played games to export'); return; }
  const bundle={type:'flagstats-bundle',exported:new Date().toISOString(),games:played};
  downloadBlob(JSON.stringify(bundle),'flagstats-bundle_'+new Date().toISOString().slice(0,10)+'.json','application/json');
  played.forEach(g=>{ g.exportedPlays=g.plays.length; });
  persist(); render(); toast(played.length+' games exported in one file');
}
function downloadBlob(data,filename,type){
  const blob=new Blob([data],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ============================================================
   SHELL
   ============================================================ */
let curTab='game';
function switchTab(t){ curTab=t;
  if(t==='tourney') startLivePolling(); else stopLivePolling();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+t).classList.add('on');
  render();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function render(){
  if(curTab==='game') renderGame();
  else if(curTab==='setup') renderSetup();
  else renderTourney();
}
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1400); }

// first-run: seed the 7 test nations and land on setup
if(!Object.keys(teams).length && !games.length){ loadTestTeams(); }
if(!games.length){ curTab='setup'; }
applyPrefs();
ensureWakeLock();
applyTheme();
switchTab(curTab);
roleProbe();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
